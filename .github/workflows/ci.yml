name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aero
          POSTGRES_PASSWORD: aero
          POSTGRES_DB: aero
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aero" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AERO_TEST_DATABASE_URL: postgres://aero:aero@localhost:5432/aero
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build the example Rust function (wasm32-wasip1)
        run: |
          rustup target add wasm32-wasip1
          cargo build --release --target wasm32-wasip1 --manifest-path examples/functions/hello-rust/Cargo.toml
          echo "AERO_EXAMPLE_WASM=$PWD/examples/functions/hello-rust/target/wasm32-wasip1/release/hello-rust.wasm" >> "$GITHUB_ENV"
      - name: Tests
        run: cargo test --workspace
      - name: Known gaps (expected to fail until their phase lands)
        run: cargo test -p aero-core --test api -- --ignored || echo "::notice::Open roadmap items — see ROADMAP.md"

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OpenAPI spec
        run: npx --yes @redocly/cli@1.25.0 lint openapi/aerobaas.yaml --skip-rule operation-4xx-response --skip-rule no-server-example.com || echo "::warning::OpenAPI lint issues"

  image:
    needs: rust
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/cargounetcom/aerobaas:latest
            ghcr.io/cargounetcom/aerobaas:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
